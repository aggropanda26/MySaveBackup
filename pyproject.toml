[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mysavebackup"
version = "0.1.0"
description = "Lokale Spielstand-Backups für Linux"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6,<7"]

[tool.setuptools.packages.find]
include = ["mysavebackup*"]
