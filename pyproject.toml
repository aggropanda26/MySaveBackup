[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mysavebackup"
version = "0.1.0"
description = "Lokale Spielstand-Backups für Linux"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
onedrive = ["msal>=1.31,<2", "keyring>=25,<26", "SecretStorage>=3.3,<4", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
include = ["mysavebackup*"]
